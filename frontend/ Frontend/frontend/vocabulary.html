
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quranic Vocabulary Explorer</title>
  <style>
    :root {
      --green: #174d3a;
      --gold: #c49a42;
      --cream: #faf8f1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--cream);
      color: #26352e;
    }
    header {
      background: var(--green);
      color: white;
      padding: 22px 16px;
      text-align: center;
    }
    main {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 16px;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    input, select {
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    input { flex: 1; min-width: 200px; }
    .word {
      background: white;
      border: 1px solid #e5e0d3;
      border-left: 5px solid var(--gold);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .arabic {
      font-size: 34px;
      text-align: right;
      direction: rtl;
      color: var(--green);
    }
    .meaning { font-size: 18px; margin: 10px 0; }
    .details { color: #68746d; font-size: 14px; }
    button {
      background: var(--gold);
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
    }
    footer { text-align: center; padding: 25px; color: #68746d; }
  </style>
</head>
<body>
  <header>
    <h1>Quranic Vocabulary Explorer</h1>
    <p>Learn Quranic Arabic word by word</p>
    <button onclick="toggleLanguage()">বাংলা / English</button>
  </header>

  <main>
    <h2 id="heading">Explore Quranic Words</h2>
    <div class="controls">
      <input id="search" type="search"
        placeholder="Search Arabic, English or Bengali...">
    </div>
    <p id="count"></p>
    <div id="words">Loading vocabulary...</div>
  </main>

  <footer>Quranic Arabic Learning Toolkit</footer>

  <script>
    let words = [];
    let language = "en";

    const translations = {
      en: {
        heading: "Explore Quranic Words",
        search: "Search Arabic, English or Bengali...",
        root: "Root",
        reference: "Reference",
        noResults: "No matching words found."
      },
      bn: {
        heading: "কুরআনের শব্দ শিখুন",
        search: "আরবি, বাংলা অথবা ইংরেজিতে খুঁজুন...",
        root: "মূল ধাতু",
        reference: "তথ্যসূত্র",
        noResults: "কোনো মিল পাওয়া যায়নি।"
      }
    };

    async function loadWords() {
      try {
        const response = await fetch("../content/vocabulary.json");
        if (!response.ok) throw new Error("Could not load vocabulary");
        words = await response.json();
        renderWords();
      } catch (error) {
        document.getElementById("words").textContent =
          "Could not load vocabulary. Please check the JSON file path.";
      }
    }

    function renderWords() {
      const t = translations[language];
      const query = document.getElementById("search").value
        .trim().toLowerCase();

      document.getElementById("heading").textContent = t.heading;
      document.getElementById("search").placeholder = t.search;

      const filtered = words.filter(word =>
        [word.arabic, word.root, word.meaning_bn, word.meaning_en]
          .some(value => value.toLowerCase().includes(query))
      );

      document.getElementById("count").textContent =
        filtered.length + " words";

      document.getElementById("words").innerHTML = filtered.length
        ? filtered.map(word => `
          <article class="word">
            <div class="arabic" lang="ar">${word.arabic}</div>
            <div class="meaning">
              ${language === "bn" ? word.meaning_bn : word.meaning_en}
            </div>
            <div class="details">
              ${t.root}: ${word.root}<br>
              ${t.reference}: ${word.reference}
            </div>
          </article>
        `).join("")
        : `<p>${t.noResults}</p>`;
    }

    function toggleLanguage() {
      language = language === "en" ? "bn" : "en";
      renderWords();
    }

    document.getElementById("search")
      .addEventListener("input", renderWords);

    loadWords();
  </script>
</body>
</html>
